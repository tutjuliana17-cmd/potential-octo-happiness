<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hotel IT Portal Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
    --primary:#2563eb;
    --secondary:#1e293b;
    --accent:#38bdf8;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #2563eb);

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.background-circle{

    position:absolute;
    border-radius:50%;
    filter:blur(100px);

}

.circle1{

    width:300px;
    height:300px;

    background:#3b82f6;

    top:-150px;
    left:-100px;

}

.circle2{

    width:350px;
    height:350px;

    background:#06b6d4;

    bottom:-150px;
    right:-100px;

}

.login-card{

    width:420px;

    border:none;

    border-radius:25px;

    backdrop-filter:blur(25px);

    background:
    rgba(255,255,255,0.12);

    box-shadow:
    0 8px 40px rgba(0,0,0,.35);

    color:white;
}

.logo{

    width:90px;
    height:90px;

    border-radius:50%;

    background:white;

    color:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:auto;

    font-size:40px;
}

.form-control{

    height:50px;

    border-radius:12px;

    border:none;
}

.btn-login{

    height:50px;

    border-radius:12px;

    font-weight:600;
}

.footer-text{

    font-size:.85rem;
    opacity:.8;

}

</style>

</head>

<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="card login-card">

<div class="card-body p-5">

<div class="logo mb-4">
<i class="bi bi-building"></i>
</div>

<h2 class="text-center fw-bold">
Hotel IT Portal
</h2>

<p class="text-center mb-4">

Asset Management • Ticketing • Network Monitoring

</p>

<form id="loginForm">

<div class="mb-3">

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person"></i>
</span>

<input
type="text"
id="username"
class="form-control"
placeholder="Username"
required>

</div>

</div>

<div class="mb-3">

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock"></i>
</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Password"
required>

<button
class="btn btn-light"
type="button"
onclick="togglePassword()">

<i id="eyeIcon"
class="bi bi-eye"></i>

</button>

</div>

</div>

<div
id="errorMessage"
class="alert alert-danger d-none">

Invalid username or password

</div>

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox">

<label class="form-check-label">

Remember Me

</label>

</div>

<button
type="submit"
class="btn btn-warning w-100 btn-login">

Sign In

</button>

</form>

<hr>

<div class="text-center footer-text">

Demo Access<br>

</div>

</div>

</div>

<script>

function togglePassword(){

const password =
document.getElementById("password");

const icon =
document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";

icon.className=
"bi bi-eye-slash";

}else{

password.type="password";

icon.className=
"bi bi-eye";

}

}

document
.getElementById("loginForm")
.addEventListener("submit",

function(e){

e.preventDefault();

const username =
document.getElementById(
"username"
).value;

const password =
document.getElementById(
"password"
).value;

if(
username==="admin" &&
password==="admin"
){

sessionStorage.setItem(
"loggedIn",
"true"
);

sessionStorage.setItem(
"username",
username
);

window.location.href=
"dashboard.html";

}
else{

document
.getElementById(
"errorMessage"
)
.classList.remove(
"d-none"
);

}

});

</script>

</body>
</html>
