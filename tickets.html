<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IT Ticket Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
    --sidebar:#0f172a;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
}

.dark-mode{
    --sidebar:#020617;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
}

body{
    background:var(--bg);
    color:var(--text);
}

.sidebar{
    min-height:100vh;
    background:var(--sidebar);
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:5px;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:15px;
    background:var(--card);
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.status-card{
    transition:.3s;
}

.status-card:hover{
    transform:translateY(-5px);
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-lg-2 sidebar p-3">

<h4 class="text-white mb-4">
🎫 IT Tickets
</h4>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
 Dashboard
</a>

<a href="assets.html">
<i class="bi bi-pc-display"></i>
 IT Assets
</a>

<a href="tickets.html">
<i class="bi bi-ticket"></i>
 IT Tickets
</a>

<a href="network.html">
<i class="bi bi-diagram-3"></i>
 Network
</a>

</div>

<!-- Content -->

<div class="col-lg-10">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container-fluid">

<span class="navbar-brand">
IT Ticket Management
</span>

<div class="d-flex align-items-center">

<span class="me-3">
👤 <span id="username"></span>
</span>

<span class="me-3 text-muted"
id="currentTime"></span>

<button
class="btn btn-dark btn-sm me-2"
onclick="toggleTheme()">

🌙

</button>

<button
class="btn btn-danger btn-sm"
onclick="logout()">

Logout

</button>

</div>

</div>

</nav>

<div class="container-fluid p-4">

<!-- Summary -->

<div class="row mb-4">

<div class="col-md-3 mb-3">
<div class="card bg-primary text-white status-card">
<div class="card-body">
<h6>Open Tickets</h6>
<h2 id="openTicket">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-warning status-card">
<div class="card-body">
<h6>In Progress</h6>
<h2 id="progressTicket">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-success text-white status-card">
<div class="card-body">
<h6>Resolved</h6>
<h2 id="resolvedTicket">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-danger text-white status-card">
<div class="card-body">
<h6>Critical</h6>
<h2 id="criticalTicket">0</h2>
</div>
</div>
</div>

</div>

<!-- Create Ticket -->

<div class="card mb-4">

<div class="card-header">
Create New Ticket
</div>

<div class="card-body">

<div class="row g-2">

<div class="col-md-2">
<input type="text"
id="requester"
class="form-control"
placeholder="Requester">
</div>

<div class="col-md-2">
<input type="text"
id="department"
class="form-control"
placeholder="Department">
</div>

<div class="col-md-2">

<select
id="category"
class="form-select">

<option>Hardware</option>
<option>Software</option>
<option>Printer</option>
<option>Network</option>
<option>OPERA PMS</option>
<option>Simphony POS</option>
<option>Email</option>
<option>SharePoint</option>
<option>CCTV</option>

</select>

</div>

<div class="col-md-2">

<select
id="priority"
class="form-select">

<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>

</select>

</div>

<div class="col-md-3">
<input
type="text"
id="issue"
class="form-control"
placeholder="Issue Description">
</div>

<div class="col-md-1">
<button
class="btn btn-primary w-100"
onclick="addTicket()">

Add

</button>
</div>

</div>

</div>

</div>

<!-- Search -->

<div class="mb-3">

<input
type="text"
id="search"
class="form-control"
placeholder="Search Ticket..."
onkeyup="renderTickets()">

</div>

<!-- Ticket Table -->

<div class="card">

<div class="card-header">
Ticket List
</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Requester</th>
<th>Dept</th>
<th>Category</th>
<th>Issue</th>
<th>Priority</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="ticketTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

if(sessionStorage.getItem("loggedIn") !== "true"){
    window.location.href="index.html";
}

document.getElementById("username").innerHTML =
sessionStorage.getItem("username") || "Admin";

function updateClock(){

document.getElementById("currentTime")
.innerHTML =
new Date().toLocaleString();

}

setInterval(updateClock,1000);
updateClock();

let tickets =
JSON.parse(
localStorage.getItem("tickets")
) || [];

function saveTickets(){

localStorage.setItem(
"tickets",
JSON.stringify(tickets)
);

updateSummary();

}

function addTicket(){

if(issue.value === ""){
alert("Issue required");
return;
}

tickets.push({

id:
"IT" +
Date.now(),

requester:
requester.value,

department:
department.value,

category:
category.value,

priority:
priority.value,

issue:
issue.value,

status:
"Open"

});

saveTickets();
renderTickets();

issue.value="";

}

function renderTickets(){

let keyword =
document.getElementById("search")
.value
.toLowerCase();

let table =
document.getElementById("ticketTable");

table.innerHTML="";

tickets.forEach((ticket,index)=>{

if(JSON.stringify(ticket)
.toLowerCase()
.includes(keyword)){

let priorityColor="success";

if(ticket.priority==="Medium")
priorityColor="warning";

if(ticket.priority==="High")
priorityColor="danger";

if(ticket.priority==="Critical")
priorityColor="dark";

let statusColor="primary";

if(ticket.status==="In Progress")
statusColor="warning";

if(ticket.status==="Resolved")
statusColor="success";

table.innerHTML += `

<tr>

<td>${ticket.id}</td>

<td>${ticket.requester}</td>

<td>${ticket.department}</td>

<td>${ticket.category}</td>

<td>${ticket.issue}</td>

<td>

<span class="badge bg-${priorityColor}">
${ticket.priority}
</span>

</td>

<td>

<span class="badge bg-${statusColor}">
${ticket.status}
</span>

</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="startTicket(${index})">

Start

</button>

<button
class="btn btn-success btn-sm"
onclick="resolveTicket(${index})">

Resolve

</button>

<button
class="btn btn-danger btn-sm"
onclick="deleteTicket(${index})">

Delete

</button>

</td>

</tr>

`;

}

});

}

function startTicket(index){

tickets[index].status =
"In Progress";

saveTickets();

renderTickets();

}

function resolveTicket(index){

tickets[index].status =
"Resolved";

saveTickets();

renderTickets();

}

function deleteTicket(index){

if(confirm(
"Delete Ticket?"
)){

tickets.splice(index,1);

saveTickets();

renderTickets();

}

}

function updateSummary(){

document.getElementById("openTicket")
.innerHTML =
tickets.filter(
t=>t.status==="Open"
).length;

document.getElementById("progressTicket")
.innerHTML =
tickets.filter(
t=>t.status==="In Progress"
).length;

document.getElementById("resolvedTicket")
.innerHTML =
tickets.filter(
t=>t.status==="Resolved"
).length;

document.getElementById("criticalTicket")
.innerHTML =
tickets.filter(
t=>t.priority==="Critical"
).length;

}

function toggleTheme(){

document.body.classList.toggle(
"dark-mode"
);

}

function logout(){

if(confirm(
"Logout?"
)){

sessionStorage.clear();

window.location.href =
"index.html";

}

}

saveTickets();
renderTickets();

</script>

</body>
</html>
