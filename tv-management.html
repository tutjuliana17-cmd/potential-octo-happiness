<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

:root{
    --sidebar:#0f172a;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
}

.dark-mode{
    --sidebar:#020617;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
}

body{
    background:var(--bg);
    color:var(--text);
}

.sidebar{
    min-height:100vh;
    background:var(--sidebar);
}

.sidebar a{
    display:block;
    padding:12px;
    margin-bottom:5px;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:15px;
    background:var(--card);
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.status-card{
    transition:.3s;
}

.status-card:hover{
    transform:translateY(-5px);
}

</style>

</head>

<body>

<div class="container-fluid p-4">

<!-- Sidebar -->

<div class="col-lg-2 sidebar p-3">

<h4 class="text-white mb-4">
🎫 IT Tickets
</h4>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
 Dashboard
</a>

<a href="assets.html">
<i class="bi bi-pc-display"></i>
 IT Assets
</a>

<a href="tickets.html">
<i class="bi bi-ticket"></i>
 IT Tickets
</a>

<a href="network.html">
<i class="bi bi-diagram-3"></i>
 Network
</a>

<a href="signed.html">
<i class="bi bi-diagram-3"></i>
 Digital Signed
</a>

</div>
    
<h2 class="mb-4">
📺 TV Management Portal
</h2>

<div class="card mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-3">
<label>TV</label>

<select class="form-select" id="tvName">

<option>Lobby TV</option>
<option>Ballroom TV</option>
<option>Meeting Room A</option>
<option>Meeting Room B</option>
<option>Restaurant TV</option>

</select>

</div>

<div class="col-md-4">
<label>Welcome Message</label>

<input
type="text"
class="form-control"
id="welcomeText"
placeholder="Welcome PT AKR Land Development">

</div>

<div class="col-md-3">
<label>Upload Image</label>

<input
type="file"
class="form-control"
id="imageUpload"
accept="image/*">

</div>

<div class="col-md-2">

<label>&nbsp;</label>

<button
class="btn btn-success w-100"
onclick="publishContent()">

Publish

</button>

</div>

</div>

</div>

</div>

<div class="row"
id="tvGrid">

</div>

</div>

<script>

let tvs = [

{
id:1,
name:"Lobby TV"
},

{
id:2,
name:"Ballroom TV"
},

{
id:3,
name:"Meeting Room A"
},

{
id:4,
name:"Meeting Room B"
},

{
id:5,
name:"Restaurant TV"
}

];

function renderTVs(){

let html="";

tvs.forEach(tv=>{

html += `
<div class="col-md-4 mb-4">

<div class="card tv-card">

<div class="card-body">

<h5>${tv.name}</h5>

<hr>

<button
class="btn btn-primary btn-sm"
onclick="openTV('${tv.name}')">

Open TV

</button>

</div>

</div>

</div>
`;

});

document.getElementById(
"tvGrid"
).innerHTML = html;

}

function publishContent(){

const tvName =
document.getElementById(
"tvName"
).value;

const message =
document.getElementById(
"welcomeText"
).value;

const image =
document.getElementById(
"imageUpload"
).files[0];

if(!image){

alert(
"Please select image"
);

return;

}

const reader =
new FileReader();

reader.onload = function(e){

localStorage.setItem(

tvName,

JSON.stringify({

welcome:message,

image:e.target.result,

lastUpdate:
new Date().toLocaleString()

})

);

alert(
"Content Published to " +
tvName
);

};

reader.readAsDataURL(image);

}

function openTV(tvName){

localStorage.setItem(
"activeTV",
tvName
);

window.open(
"signage.html",
"_blank"
);

}

renderTVs();

</script>

</body>
</html>
