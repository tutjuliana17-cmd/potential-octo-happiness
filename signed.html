<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Digital Signage</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:black;
overflow:hidden;
font-family:Segoe UI;
color:white;

}

#wrapper{

width:100vw;
height:100vh;

position:relative;

display:flex;
justify-content:center;
align-items:center;

}

img{

max-width:100%;
max-height:100%;

}

.overlay{

position:absolute;

top:0;
left:0;
right:0;

padding:25px;

display:flex;

justify-content:space-between;

background:
linear-gradient(
rgba(0,0,0,.6),
transparent
);

}

#welcome{

font-size:2rem;
font-weight:bold;

}

#clock{

font-size:1.5rem;

}

#lastUpdate{

position:absolute;

bottom:20px;
right:20px;

background:
rgba(0,0,0,.5);

padding:10px 15px;

border-radius:10px;

}

</style>

</head>

<body>

<div id="wrapper">

<div class="overlay">

<div id="welcome">

Welcome Guest

</div>

<div id="clock">

</div>

</div>

<img id="image">

<div id="lastUpdate"></div>

</div>

<script>

const tvName =
localStorage.getItem(
"activeTV"
);

const data =
JSON.parse(
localStorage.getItem(
tvName
)
);

if(data){

document.getElementById(
"welcome"
).innerHTML =
data.welcome;

document.getElementById(
"image"
).src =
data.image;

document.getElementById(
"lastUpdate"
).innerHTML =
"Updated : " +
data.lastUpdate;

}

function updateClock(){

document.getElementById(
"clock"
).innerHTML =

new Date()
.toLocaleString();

}

setInterval(
updateClock,
1000
);

updateClock();

</script>

</body>
</html>
