<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Digital Signage</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
    color:white;
    font-family:Segoe UI;
}

#contentArea{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

}

#displayImage{

    max-width:100%;
    max-height:100%;
    display:none;

}

#displayVideo{

    width:100%;
    height:100%;
    object-fit:contain;
    display:none;

}

.top-bar{

    position:absolute;

    top:20px;
    left:20px;
    right:20px;

    z-index:1000;

    display:flex;
    justify-content:space-between;

}

.clock{

    font-size:2rem;
    font-weight:bold;
}

.welcome{

    font-size:2rem;
    font-weight:bold;
}

.admin-panel{

    position:fixed;
    bottom:20px;
    right:20px;

    z-index:9999;
}

.settings{

    background:rgba(0,0,0,.85);

    padding:20px;

    border-radius:15px;

    width:350px;

    display:none;
}

</style>

</head>

<body>

<div id="contentArea">

<div class="top-bar">

<div class="welcome">

🏨 Welcome Guests

</div>

<div
class="clock"
id="clock">

</div>

</div>

<img
id="displayImage">

<video
id="displayVideo"
autoplay
muted
controls=false>

</video>

</div>

<!-- ADMIN PANEL -->

<div class="admin-panel">

<button
class="btn btn-warning"
onclick="toggleSettings()">

⚙ Settings

</button>

<div
id="settingsPanel"
class="settings mt-2">

<h5>

Digital Signage Control

</h5>

<hr>

<label class="form-label">

Upload Image

</label>

<input
type="file"
id="imageUpload"
class="form-control"
accept="image/*">

<br>

<label class="form-label">

Upload Video

</label>

<input
type="file"
id="videoUpload"
class="form-control"
accept="video/*">

<br>

<label>

Welcome Message

</label>

<input
type="text"
id="welcomeText"
class="form-control"
placeholder="Welcome Message">

<br>

<button
class="btn btn-success w-100"
onclick="saveSettings()">

Save

</button>

</div>

</div>

<script>

const image =
document.getElementById(
"displayImage"
);

const video =
document.getElementById(
"displayVideo"
);

function startClock(){

    setInterval(()=>{

        document
        .getElementById(
        "clock"
        )
        .innerHTML =

        new Date()
        .toLocaleString();

    },1000);

}

startClock();

function toggleSettings(){

    const panel =
    document.getElementById(
    "settingsPanel"
    );

    panel.style.display =

    panel.style.display ===
    "block"

    ?

    "none"

    :

    "block";

}

function saveSettings(){

    const imageFile =

    document.getElementById(
    "imageUpload"
    )
    .files[0];

    const videoFile =

    document.getElementById(
    "videoUpload"
    )
    .files[0];

    const text =

    document.getElementById(
    "welcomeText"
    )
    .value;

    if(text){

        localStorage.setItem(
        "welcomeText",
        text
        );

        document.querySelector(
        ".welcome"
        ).innerHTML = text;

    }

    if(imageFile){

        const reader =
        new FileReader();

        reader.onload =

        function(e){

            localStorage.setItem(
            "signageImage",
            e.target.result
            );

            showImage(
            e.target.result
            );

        }

        reader.readAsDataURL(
        imageFile
        );

    }

    if(videoFile){

        const reader =
        new FileReader();

        reader.onload =

        function(e){

            localStorage.setItem(
            "signageVideo",
            e.target.result
            );

            showVideo(
            e.target.result
            );

        }

        reader.readAsDataURL(
        videoFile
        );

    }

}

function showImage(src){

    video.pause();

    video.style.display =
    "none";

    image.src = src;

    image.style.display =
    "block";

}

function showVideo(src){

    image.style.display =
    "none";

    video.src = src;

    video.style.display =
    "block";

    video.play();

}

window.onload = function(){

    const img =

    localStorage.getItem(
    "signageImage"
    );

    const vid =

    localStorage.getItem(
    "signageVideo"
    );

    const msg =

    localStorage.getItem(
    "welcomeText"
    );

    if(msg){

        document
        .querySelector(
        ".welcome"
        )
        .innerHTML = msg;

    }

    if(img){

        showImage(img);

    }

    if(vid){

        showVideo(vid);

    }

};

</script>

</body>
</html>
