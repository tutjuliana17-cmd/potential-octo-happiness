<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Year Countdown 2027</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

margin:0;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

overflow:hidden;

}

/* GOLD PARTICLES */

.particles{

position:absolute;
inset:0;

background-image:
radial-gradient(
#D4AF37 1px,
transparent 1px
);

background-size:50px 50px;

opacity:.15;

animation:
moveParticles 20s linear infinite;

}

@keyframes moveParticles{

from{
background-position:0 0;
}

to{
background-position:0 1000px;
}

}

/* LOGOS */

.logo-bar{

position:absolute;

top:20px;
left:20px;
right:20px;

display:flex;

justify-content:space-between;

align-items:center;

z-index:10;

}

.logo-bar img{

height:
clamp(
40px,
8vw,
90px
);

object-fit:contain;

}


.company-logo{

background:white;

padding:10px;

border-radius:15px;

}

/* CLOCK */

.clock{

position:absolute;

top:45px;
right:250px;

font-size:1.2rem;

font-weight:600;

color:#D4AF37;

z-index:10;

}

/* MAIN AREA */

.container-box{

position:relative;

width:100%;

max-width:1400px;

padding:20px;

margin:auto;

text-align:center;

z-index:10;

}

.hotel-name{

font-size:
clamp(
0.9rem,
2vw,
1.4rem
);

letter-spacing:
clamp(
2px,
0.8vw,
8px
);

color:#D4AF37;

margin-bottom:20px;

text-align:center;

}

.welcome{

font-size:
clamp(
1rem,
3vw,
1.8rem
);

letter-spacing:
clamp(
3px,
1vw,
10px
);

margin-bottom:20px;

}

.company{

font-size:
clamp(
3rem,
10vw,
6rem
);

}

font-weight:700;

margin-bottom:15px;

}

.subtitle{

font-size:2rem;

color:#D4AF37;

margin-bottom:40px;

}

/* COUNTDOWN */

.countdown{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

flex-wrap:wrap;

width:100%;

margin-top:30px;

}

.time-box{

width:
clamp(
90px,
15vw,
180px
);

}

.time-number{

font-size:
clamp(
2rem,
5vw,
4rem
);

}

font-weight:700;

color:#D4AF37;

animation:
pulse 1s infinite;

}

.time-label{

font-size:1rem;

letter-spacing:2px;

text-transform:uppercase;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

/* STATUS */

.status{

margin-top:50px;

font-size:2rem;

font-weight:600;

animation:
glow 2s infinite alternate;

}

@keyframes glow{

from{
text-shadow:
0 0 10px #D4AF37;
}

to{

text-shadow:
0 0 20px #FFD700,
0 0 40px #FFD700;

}

}

.footer{

margin-top:30px;

font-size:1.2rem;

color:#d1d5db;

}
 @media (max-width:768px){

.logo-bar{

top:15px;

left:15px;
right:15px;

}

.clock{

display:none;

}

.company{

font-size:2.5rem;

}

.subtitle{

font-size:1.2rem;

}

.time-box{

width:120px;

}

.status{

font-size:1.3rem;

}

.footer{

font-size:.9rem;

padding-left:20px;
padding-right:20px;

}

}

@media (max-width:480px){

.time-box{

width:90px;

padding:15px;

}

.time-number{

font-size:2rem;

}

.time-label{

font-size:.8rem;

}

}

</style>

</head>

<body>

<div class="particles"></div>

<!-- LOGOS -->

<div class="logo-bar">

<img
id="hotelLogo"
src="hotel-logo.png"
alt="Hotel Logo">

<img
id="companyLogo"
src="company-logo.png"
class="company-logo"
alt="Company Logo">

</div>

<!-- CLOCK -->

<div
class="clock"
id="currentClock">
</div>

<!-- MAIN -->

<div class="container-box">

<div class="hotel-name">

ALOFT JAKARTA KEBON JERUK

</div>

<div class="welcome">

WELCOME

</div>

<div class="company">

2027

</div>

<div class="subtitle">

NEW YEAR COUNTDOWN

</div>

<div class="countdown">

<div class="time-box">

<div
class="time-number"
id="days">

0

</div>

<div class="time-label">

Days

</div>

</div>

<div class="time-box">

<div
class="time-number"
id="hours">

0

</div>

<div class="time-label">

Hours

</div>

</div>

<div class="time-box">

<div
class="time-number"
id="minutes">

0

</div>

<div class="time-label">

Minutes

</div>

</div>

<div class="time-box">

<div
class="time-number"
id="seconds">

0

</div>

<div class="time-label">

Seconds

</div>

</div>

</div>

<div
class="status"
id="statusMessage">

✨ EVENT STARTS SOON ✨

</div>

<div class="footer">

01 JANUARY 2027 • 00:00 WIB

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.7/dist/index.umd.js"></script>

<script>

// TARGET NEW YEAR

let eventDate =
new Date(
"2027-01-01T00:00:00"
).getTime();

const config =
JSON.parse(
localStorage.getItem(
"countdownConfig"
)
);

if(config){

document.querySelector(
".hotel-name"
).innerHTML =
config.hotelName;

document.querySelector(
".company"
).innerHTML =
config.mainTitle;

document.querySelector(
".subtitle"
).innerHTML =
config.subtitle;

document.getElementById(
"statusMessage"
).innerHTML =
config.statusText;

document.querySelector(
".footer"
).innerHTML =
config.footer;

eventDate =
new Date(
config.eventDate
).getTime();

if(config.hotelLogo){

document.querySelector(
".logo-bar img:first-child"
).src =
config.hotelLogo;

}

if(config.companyLogo){

document.querySelector(
".company-logo"
).src =
config.companyLogo;

}

}

// FIREWORKS

const fireworks =
new Fireworks.default(
document.body,
{
autoresize:true,
opacity:0.5,
acceleration:1.05,
friction:0.97,
gravity:1.5,
particles:120
}
);

let started = false;

function updateCountdown(){

const now =
new Date().getTime();

const distance =
eventDate - now;

if(distance <= 0){

document.getElementById(
"statusMessage"
).innerHTML =

"🎉 HAPPY NEW YEAR 2027 🎉";

document.querySelector(
".company"
).innerHTML =

"2027";

document.body.style.background =

"linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b)";

document.getElementById("days").innerHTML = "0";
document.getElementById("hours").innerHTML = "0";
document.getElementById("minutes").innerHTML = "0";
document.getElementById("seconds").innerHTML = "0";

if(!started){

fireworks.start();

started = true;

}

return;

}

const days =
Math.floor(
distance /(1000*60*60*24)
);

const hours =
Math.floor(
(distance %
(1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(distance %
(1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(distance %
(1000*60))
/
1000
);

document.getElementById(
"days"
).innerHTML = days;

document.getElementById(
"hours"
).innerHTML = hours;

document.getElementById(
"minutes"
).innerHTML = minutes;

document.getElementById(
"seconds"
).innerHTML = seconds;

}

setInterval(() => {

loadConfiguration();

},30000);

updateCountdown();

// CLOCK

function updateClock(){

document.getElementById(
"currentClock"
).innerHTML =

new Date()
.toLocaleString();

}

setInterval(
updateClock,
1000
);

updateClock();

</script>
<script>

function loadConfiguration(){

    const config = JSON.parse(
        localStorage.getItem(
            "countdownConfig"
        )
    );

    if(!config) return;

    document.querySelector(
        ".hotel-name"
    ).innerHTML =
    config.hotelName;

    document.querySelector(
        ".company"
    ).innerHTML =
    config.mainTitle;

    document.querySelector(
        ".subtitle"
    ).innerHTML =
    config.subtitle;

    document.getElementById(
        "statusMessage"
    ).innerHTML =
    config.statusText;

    document.querySelector(
        ".footer"
    ).innerHTML =
    config.footer;

    if(config.hotelLogo){

        document.getElementById(
            "hotelLogo"
        ).src =
        config.hotelLogo;

    }

    if(config.companyLogo){

        document.getElementById(
            "companyLogo"
        ).src =
        config.companyLogo;

    }

    eventDate =
    new Date(
        config.eventDate
    ).getTime();

}

loadConfiguration();

setInterval(
    loadConfiguration,
    30000
);

</script>
</body>
</html>
