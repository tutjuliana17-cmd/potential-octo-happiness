<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Countdown Display</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--gold:#d4af37;
--bg1:#081225;
--bg2:#10284d;

}

body{

font-family:'Montserrat',sans-serif;

background:
radial-gradient(
circle at top,
#15376f,
#081225 60%
);

color:white;

min-height:100vh;

overflow:hidden;

position:relative;

display:flex;
justify-content:center;
align-items:center;

}

/* background dots */

body::before{

content:"";

position:absolute;

inset:0;

background-image:

radial-gradient(
var(--gold) 1px,
transparent 1px
);

background-size:40px 40px;

opacity:.15;

}

/* hotel logo */

.logo-bar{

position:absolute;

top:20px;
left:20px;

z-index:10;

}

.logo-bar img{

height:clamp(
50px,
7vw,
90px
);

object-fit:contain;

}

/* clock */

.clock{

position:absolute;

top:30px;
right:30px;

font-size:clamp(
1rem,
2vw,
1.8rem
);

font-weight:600;

color:var(--gold);

z-index:10;

}

/* content */

.container{

position:relative;

z-index:5;

width:100%;

max-width:1400px;

padding:20px;

text-align:center;

}

.hotel-name{

font-size:
clamp(
0.9rem,
2vw,
1.4rem
);

letter-spacing:6px;

color:var(--gold);

margin-bottom:15px;

}

.welcome{

font-size:
clamp(
1rem,
3vw,
2rem
);

letter-spacing:10px;

margin-bottom:15px;

}

.title{

font-size:
clamp(
3rem,
10vw,
6rem
);

font-weight:700;

margin-bottom:10px;

}

.subtitle{

font-size:
clamp(
1rem,
3vw,
2rem
);

color:var(--gold);

margin-bottom:40px;

}

/* countdown */

.countdown{

display:flex;

justify-content:center;

align-items:center;

flex-wrap:wrap;

gap:20px;

margin-bottom:40px;

}

.time-box{

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.1);

backdrop-filter:
blur(10px);

border-radius:20px;

width:
clamp(
90px,
18vw,
180px
);

padding:20px;

}

.time-value{

font-size:
clamp(
2rem,
5vw,
4rem
);

font-weight:700;

color:var(--gold);

}

.time-label{

font-size:
clamp(
.7rem,
1vw,
1rem
);

letter-spacing:2px;

margin-top:5px;

}

/* status */

.status{

font-size:
clamp(
1rem,
2vw,
2rem
);

font-weight:600;

color:white;

margin-bottom:20px;

text-shadow:
0 0 15px #d4af37;

}

/* footer */

.footer{

font-size:
clamp(
0.8rem,
1.5vw,
1.2rem
);

opacity:.9;

}

/* mobile */

@media(max-width:768px){

.clock{

position:static;

margin-bottom:20px;

}

.logo-bar{

top:15px;
left:15px;

}

.countdown{

gap:10px;

}

.time-box{

width:110px;

padding:15px;

}

}

</style>

</head>

<body>

<div class="logo-bar">

<img
id="hotelLogo"
src="hotel-logo.png"
alt="Hotel Logo">

</div>

<div
class="clock"
id="currentClock">

</div>

<div class="container">

<div
class="hotel-name"
id="hotelName">

ALOFT JAKARTA KEBON JERUK

</div>

<div class="welcome">

WELCOME

</div>

<div
class="title"
id="mainTitle">

2027

</div>

<div
class="subtitle"
id="subtitle">

NEW YEAR COUNTDOWN

</div>

<div class="countdown">

<div class="time-box">

<div
class="time-value"
id="days">

0

</div>

<div class="time-label">
DAYS
</div>

</div>

<div class="time-box">

<div
class="time-value"
id="hours">

0

</div>

<div class="time-label">
HOURS
</div>

</div>

<div class="time-box">

<div
class="time-value"
id="minutes">

0

</div>

<div class="time-label">
MINUTES
</div>

</div>

<div class="time-box">

<div
class="time-value"
id="seconds">

0

</div>

<div class="time-label">
SECONDS
</div>

</div>

</div>

<div
class="status"
id="statusMessage">

✨ EVENT STARTS SOON ✨

</div>

<div
class="footer"
id="footerText">

01 JANUARY 2027 • 00:00 WIB

</div>

</div>

<script>

let targetDate =
new Date(
"2027-01-01T00:00:00"
).getTime();

function loadConfiguration(){

const config =
JSON.parse(
localStorage.getItem(
"countdownConfig"
)
);

if(!config)
return;

hotelName.innerHTML =
config.hotelName || "";

mainTitle.innerHTML =
config.mainTitle || "";

subtitle.innerHTML =
config.subtitle || "";

statusMessage.innerHTML =
config.statusText || "";

footerText.innerHTML =
config.footer || "";

if(config.hotelLogo){

hotelLogo.src =
config.hotelLogo;

}

if(config.eventDate){

targetDate =
new Date(
config.eventDate
).getTime();

}

}

loadConfiguration();

setInterval(
loadConfiguration,
30000
);

function updateCountdown(){

const now =
new Date().getTime();

const distance =
targetDate - now;

if(distance <= 0){

statusMessage.innerHTML =
"🎉 EVENT STARTED 🎉";

return;

}

const days =
Math.floor(
distance /
(1000*60*60*24)
);

const hours =
Math.floor(
(distance %
(1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(distance %
(1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(distance %
(1000*60))
/
1000
);

document.getElementById("days")
.innerHTML =
days;

document.getElementById("hours")
.innerHTML =
hours;

document.getElementById("minutes")
.innerHTML =
minutes;

document.getElementById("seconds")
.innerHTML =
seconds;

}

setInterval(
updateCountdown,
1000
);

updateCountdown();

function updateClock(){

currentClock.innerHTML =
new Date()
.toLocaleString();

}

setInterval(
updateClock,
1000
);

updateClock();

</script>

</body>
</html>
