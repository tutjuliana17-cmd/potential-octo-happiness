<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Countdown Display</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--gold:#d4af37;
}

body{

font-family:'Montserrat',sans-serif;

background:
radial-gradient(
circle at top,
#15376f,
#081225 60%
);

color:white;

min-height:100vh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

position:relative;

}

/* GOLD PARTICLES */

body::before{

content:"";

position:absolute;

inset:0;

background-image:
radial-gradient(
var(--gold) 1px,
transparent 1px
);

background-size:40px 40px;

opacity:.15;

animation:
particlesMove
20s linear infinite;

}

@keyframes particlesMove{

from{
background-position:0 0;
}

to{
background-position:0 1000px;
}

}

/* FIREWORKS */

#fireworks{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

display:none;

z-index:999;

}

/* HOTEL LOGO */

.logo-bar{

position:absolute;

top:20px;
middle:20px;

z-index:20;

}

.logo-bar img{

height:
clamp(
150px,
8vw,
100px
);

object-fit:contain;

}

/* CLOCK */

.clock{

position:absolute;

top:30px;
right:30px;

font-size:
clamp(
1rem,
2vw,
1.6rem
);

font-weight:600;

color:var(--gold);

z-index:20;

}

/* FULLSCREEN BUTTON */

#fullscreenBtn{

position:absolute;

bottom:20px;
right:20px;

background:
rgba(212,175,55,.9);

color:black;

border:none;

padding:12px 18px;

border-radius:12px;

font-weight:bold;

cursor:pointer;

z-index:9999;

}

#fullscreenBtn:hover{

transform:scale(1.05);

}

@media(min-width:1024px){

#fullscreenBtn{

opacity:.15;

}

#fullscreenBtn:hover{

opacity:1;

}

}

/* CONTENT */

.container{

width:100%;

max-width:1400px;

padding:20px;

text-align:center;

position:relative;

z-index:5;

}

.hotel-name{

font-size:
clamp(
1rem,
0vw,
1.6rem
);

letter-spacing:6px;

color:var(--gold);

margin-bottom:0px;

}

.welcome{

font-size:
clamp(
1rem,
3vw,
2rem
);

letter-spacing:10px;

margin-bottom:15px;

}

.title{

font-size:
clamp(
3rem,
10vw,
6rem
);

font-weight:700;

margin-bottom:15px;

}

.subtitle{

font-size:
clamp(
1rem,
3vw,
2rem
);

color:var(--gold);

margin-bottom:40px;

}

.countdown{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-bottom:40px;

}

.time-box{

background:
rgba(255,255,255,.08);

border:
1px solid rgba(255,255,255,.15);

backdrop-filter:
blur(10px);

border-radius:20px;

padding:20px;

width:
clamp(
90px,
16vw,
180px
);

}

.time-value{

font-size:
clamp(
2rem,
5vw,
4rem
);

font-weight:700;

color:var(--gold);

animation:
pulse 1s infinite;

}

.time-label{

margin-top:10px;

font-size:
clamp(
.7rem,
1vw,
1rem
);

letter-spacing:2px;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

.status{

font-size:
clamp(
1rem,
2vw,
2rem
);

font-weight:600;

text-shadow:
0 0 15px #d4af37;

margin-bottom:20px;

}

.footer{

font-size:
clamp(
0.8rem,
1.5vw,
1.2rem
);

opacity:.9;

}

.happy-year{

animation:
zoomHappy 2s infinite alternate;

}

@keyframes zoomHappy{

from{
transform:scale(1);
}

to{
transform:scale(1.15);
}

}

body.signage{
cursor:none;
}

@media(max-width:768px){

.clock{

position:static;

margin-bottom:20px;

}

.logo-bar{

top:10px;
left:10px;

}

.countdown{

gap:10px;

}

.time-box{

width:110px;

padding:15px;

}

}

</style>

</head>

<body>

<canvas id="fireworks"></canvas>

<div class="logo-bar">

<img
id="hotelLogo"
src="hotel-logo.png"
alt="Hotel Logo">

</div>

<!-- <div
class="clock"
id="currentClock">

</div>
-->
<div class="container">

<div
class="hotel-name"
id="hotelName">

ALOFT JAKARTA KEBON JERUK

</div>

<div class="welcome">

WELCOME

</div>

<div
class="title"
id="mainTitle">

2027

</div>

<div
class="subtitle"
id="subtitle">

NEW YEAR COUNTDOWN

</div>

<div class="countdown">

<div class="time-box">

<div
class="time-value"
id="days">

0

</div>
  
<div class="time-label">

DAYS

</div>

</div>

<div class="time-box">

<div
class="time-value"
id="hours">

0

</div>
  
<div class="time-label">

HOURS

</div>

</div>

<div class="time-box">

<div
class="time-value"
id="minutes">

0

</div>

<div class="time-label">

MINUTES

</div>

</div>

<div class="time-box">

<div
class="time-value"
id="seconds">

0

</div>

<div class="time-label">

SECONDS

</div>

</div>

</div>

<div
class="status"
id="statusMessage">

✨ EVENT STARTS SOON ✨

</div>

<div
class="footer"
id="footerText">

01 JANUARY 2027 • 00:00 WIB

</div>

</div>

<button
id="fullscreenBtn"
onclick="openFullscreen()">

⛶ Full Screen

</button>

<script>

let targetDate =
new Date(
"2027-01-01T00:00:00"
).getTime();

/* LOAD CONFIG */

function loadConfiguration(){

const config =
JSON.parse(
localStorage.getItem(
"countdownConfig"
)
);

if(!config)
return;

hotelName.innerHTML =
config.hotelName ||
"ALOFT JAKARTA KEBON JERUK";

mainTitle.innerHTML =
config.mainTitle ||
"2027";

subtitle.innerHTML =
config.subtitle ||
"NEW YEAR COUNTDOWN";

statusMessage.innerHTML =
config.statusText ||
"✨ EVENT STARTS SOON ✨";

footerText.innerHTML =
config.footer ||
"01 JANUARY 2027 • 00:00 WIB";

if(config.hotelLogo){

hotelLogo.src =
config.hotelLogo;

}

if(config.eventDate){

targetDate =
new Date(
config.eventDate
).getTime();

}

}

loadConfiguration();

setInterval(
loadConfiguration,
30000
);

/* CLOCK */
/*
function updateClock(){

currentClock.innerHTML =

new Date()
.toLocaleString();

}

setInterval(
updateClock,
1000
);

updateClock();

/* COUNTDOWN */

function updateCountdown(){

const now =
new Date().getTime();

const distance =
targetDate - now;

if(distance <= 0){

statusMessage.innerHTML =

"🎉 HAPPY NEW YEAR 🎉";

mainTitle.innerHTML =

" 2027 ";

mainTitle.classList.add(
"happy-year"
);

document.getElementById(
"fireworks"
).style.display =
"block";

if(
!window.fireworksStarted
){

window.fireworksStarted =
true;

setInterval(
createFirework,
400
);

}

days.innerHTML = "0";
hours.innerHTML = "0";
minutes.innerHTML = "0";
seconds.innerHTML = "0";

return;

}

days.innerHTML =
Math.floor(
distance /
(1000*60*60*24)
);

hours.innerHTML =
Math.floor(
(distance %
(1000*60*60*24))
/
(1000*60*60)
);

minutes.innerHTML =
Math.floor(
(distance %
(1000*60*60))
/
(1000*60)
);

seconds.innerHTML =
Math.floor(
(distance %
(1000*60))
/
1000
);

}

setInterval(
updateCountdown,
1000
);

updateCountdown();

/* FULLSCREEN */

function openFullscreen(){

const elem =
document.documentElement;

if(elem.requestFullscreen){

elem.requestFullscreen();

}

}

document.addEventListener(
"dblclick",
openFullscreen
);

/* FIREWORKS */

const canvas =
document.getElementById(
"fireworks"
);

const ctx =
canvas.getContext(
"2d"
);

function resizeCanvas(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

let particles=[];

function createFirework(){

const x =
Math.random() *
canvas.width;

const y =
Math.random() *
(canvas.height*0.6);

for(let i=0;i<100;i++){

particles.push({

x:x,
y:y,

radius:
Math.random()*3+1,

vx:
(Math.random()-0.5)*8,

vy:
(Math.random()-0.5)*8,

alpha:1,

color:
`hsl(${Math.random()*360},100%,60%)`

});

}

}

function animateFireworks(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

particles.forEach(
(p,index)=>{

p.x += p.vx;
p.y += p.vy;

p.alpha -= 0.01;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.radius,
0,
Math.PI*2
);

ctx.fillStyle =
`rgba(255,255,255,${p.alpha})`;

ctx.fill();

if(p.alpha<=0){

particles.splice(
index,
1
);

}

});

requestAnimationFrame(
animateFireworks
);

}

animateFireworks();

</script>

</body>
</html>
