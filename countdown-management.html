<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Countdown Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.card{

border:none;

border-radius:20px;

box-shadow:
0 5px 20px rgba(0,0,0,.1);

}

.logo-preview{

margin-top:10px;

max-height:100px;

max-width:100%;

border-radius:10px;

}

.header{

margin-bottom:30px;

}

</style>

</head>

<body>

<div class="container py-5">

<div class="header">

<h2>

⏳ Countdown Management

</h2>

<p class="text-muted">

Manage New Year Countdown Display

</p>

</div>

<div class="card">

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Hotel Name

</label>

<input
id="hotelName"
class="form-control"
value="ALOFT JAKARTA KEBON JERUK">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Main Title

</label>

<input
id="mainTitle"
class="form-control"
value="2027">

</div>

</div>

<div class="mb-3">

<label class="form-label">

Subtitle

</label>

<input
id="subtitle"
class="form-control"
value="NEW YEAR COUNTDOWN">

</div>

<div class="mb-3">

<label class="form-label">

Status Text

</label>

<input
id="statusText"
class="form-control"
value="✨ EVENT STARTS SOON ✨">

</div>

<div class="mb-3">

<label class="form-label">

Footer Text

</label>

<input
id="footer"
class="form-control"
value="01 JANUARY 2027 • 00:00 WIB">

</div>

<div class="mb-4">

<label class="form-label">

Event Date & Time

</label>

<input
type="datetime-local"
id="eventDate"
class="form-control">

</div>

<hr>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Hotel Logo

</label>

<input
type="file"
accept="image/*"
class="form-control"
id="hotelLogo">

<img
id="hotelPreview"
class="logo-preview">

</div>

</div>

<hr>

<div class="d-grid gap-2">

<button
class="btn btn-success"
onclick="saveConfig()">

<i class="bi bi-floppy"></i>

Save Configuration

</button>

<button
class="btn btn-primary"
onclick="previewCountdown()">

<i class="bi bi-eye"></i>

Preview Countdown

</button>

<button
class="btn btn-dark"
onclick="clearConfig()">

<i class="bi bi-trash"></i>

Clear Configuration

</button>

</div>

</div>

</div>

</div>

<script>

let hotelLogoBase64="";

function loadExistingData(){

const config =

JSON.parse(
localStorage.getItem(
"countdownConfig"
)
);

if(!config)
return;

hotelName.value =
config.hotelName || "";

mainTitle.value =
config.mainTitle || "";

subtitle.value =
config.subtitle || "";

statusText.value =
config.statusText || "";

footer.value =
config.footer || "";

eventDate.value =
config.eventDate || "";

if(config.hotelLogo){

hotelLogoBase64 =
config.hotelLogo;

hotelPreview.src =
config.hotelLogo;

}

}

document
.getElementById(
"hotelLogo"
)
.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file)
return;

const reader =
new FileReader();

reader.onload =
function(evt){

hotelLogoBase64 =
evt.target.result;

hotelPreview.src =
hotelLogoBase64;

}

reader.readAsDataURL(
file
);

}
);

function saveConfig(){

const config = {

hotelName:
hotelName.value,

mainTitle:
mainTitle.value,

subtitle:
subtitle.value,

statusText:
statusText.value,

footer:
footer.value,

eventDate:
eventDate.value,

hotelLogo:
hotelLogoBase64

};

localStorage.setItem(
"countdownConfig",
JSON.stringify(config)
);

alert(
"Configuration Saved"
);

}

function previewCountdown(){

saveConfig();

window.open(
"newyear-countdown.html",
"_blank"
);

}

function clearConfig(){

if(
confirm(
"Clear all configuration?"
)
){

localStorage.removeItem(
"countdownConfig"
);

location.reload();

}

}

loadExistingData();

</script>

</body>
</html>
