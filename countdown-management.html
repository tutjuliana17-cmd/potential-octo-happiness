<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Countdown Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.logo-preview{
    max-height:80px;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card">

<div class="card-header bg-primary text-white">

<h4 class="mb-0">
⏳ Countdown Management
</h4>

</div>

<div class="card-body">

<div class="mb-3">

<label>
Hotel Name
</label>

<input
id="hotelName"
class="form-control"
value="ALOFT JAKARTA KEBON JERUK">

</div>

<div class="mb-3">

<label>
Main Title
</label>

<input
id="company"
class="form-control"
value="2027">

</div>

<div class="mb-3">

<label>
Subtitle
</label>

<input
id="subtitle"
class="form-control"
value="NEW YEAR COUNTDOWN">

</div>

<div class="mb-3">

<label>
Status Text
</label>

<input
id="statusText"
class="form-control"
value="✨ EVENT STARTS SOON ✨">

</div>

<div class="mb-3">

<label>
Footer Text
</label>

<input
id="footer"
class="form-control"
value="01 JANUARY 2027 • 00:00 WIB">

</div>

<div class="mb-3">

<label>
Countdown Date & Time
</label>

<input
type="datetime-local"
id="eventDate"
class="form-control">

</div>

<hr>

<div class="row">

<div class="col-md-6">

<label>

Hotel Logo

</label>

<input
type="file"
id="hotelLogo"
class="form-control"
accept="image/*">

<img
id="hotelPreview"
class="logo-preview">

</div>

<div class="col-md-6">

<label>

Company Logo

</label>

<input
type="file"
id="companyLogo"
class="form-control"
accept="image/*">

<img
id="companyPreview"
class="logo-preview">

</div>

</div>

<hr>

<div class="d-grid gap-2">

<button
class="btn btn-success"
onclick="saveConfig()">

💾 Save

</button>

<button
class="btn btn-primary"
onclick="previewCountdown()">

👁 Preview Countdown

</button>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

let hotelLogoBase64="";
let companyLogoBase64="";

document
.getElementById("hotelLogo")
.addEventListener(
"change",
function(e){

const reader =
new FileReader();

reader.onload = function(event){

hotelLogoBase64 =
event.target.result;

document.getElementById(
"hotelPreview"
).src =
hotelLogoBase64;

};

reader.readAsDataURL(
e.target.files[0]
);

});

document
.getElementById("companyLogo")
.addEventListener(
"change",
function(e){

const reader =
new FileReader();

reader.onload = function(event){

companyLogoBase64 =
event.target.result;

document.getElementById(
"companyPreview"
).src =
companyLogoBase64;

};

reader.readAsDataURL(
e.target.files[0]
);

});

function saveConfig(){

const config = {

hotelName:
document.getElementById(
"hotelName"
).value,

company:
document.getElementById(
"company"
).value,

subtitle:
document.getElementById(
"subtitle"
).value,

statusText:
document.getElementById(
"statusText"
).value,

footer:
document.getElementById(
"footer"
).value,

eventDate:
document.getElementById(
"eventDate"
).value,

hotelLogo:
hotelLogoBase64,

companyLogo:
companyLogoBase64

};

localStorage.setItem(
"countdownConfig",
JSON.stringify(config)
);

alert(
"Configuration Saved"
);

}

function previewCountdown(){

saveConfig();

window.open(
"newyear-countdown.html",
"_blank"
);

}

</script>

</body>
</html>
