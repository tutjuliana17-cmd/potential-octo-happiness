<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IT Asset Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
if(sessionStorage.getItem("loggedIn") !== "true"){
    window.location.href="index.html";
}
</script>

<style>

:root{
    --sidebar:#0f172a;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
}

.dark-mode{
    --sidebar:#020617;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
}

body{
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

.sidebar{
    min-height:100vh;
    background:var(--sidebar);
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:5px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.card{
    border:none;
    border-radius:15px;
    background:var(--card);
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.chart-container{
    position:relative;
    height:350px;
}

.status-card{
    transition:.3s;
}

.status-card:hover{
    transform:translateY(-5px);
}

@media(max-width:768px){

.sidebar{
min-height:auto;
}

}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- SIDEBAR -->

<div class="col-lg-2 sidebar p-3">

<h4 class="text-white mb-4">
🌐 IT Asset Management
</h4>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
 Dashboard
</a>

<a href="assets.html">
<i class="bi bi-pc-display"></i>
 IT Assets
</a>

<a href="tickets.html">
<i class="bi bi-ticket"></i>
 IT Tickets
</a>

<a href="network.html">
<i class="bi bi-diagram-3"></i>
 Network
</a>

</div>

<!-- MAIN -->

<div class="col-lg-10">

<!-- TOP NAV -->

<div class="col-lg-10">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container-fluid">

<span class="navbar-brand">
IT Assets Management
</span>

<div class="d-flex align-items-center">

<span class="me-3">
👤 <span id="username"></span>
</span>

<span class="me-3 text-muted"
id="currentTime"></span>

<button
class="btn btn-dark btn-sm me-2"
onclick="toggleTheme()">

🌙

</button>

<button
class="btn btn-danger btn-sm"
onclick="logout()">

Logout

</button>

</div>

</div>

</nav>

<div class="container-fluid p-4">

<!-- SUMMARY -->

<div class="row mb-4">

<div class="col-md-3 mb-3">
<div class="card bg-primary text-white summary-card">
<div class="card-body">
<h6>Total Assets</h6>
<h2 id="totalAsset">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-success text-white summary-card">
<div class="card-body">
<h6>Active</h6>
<h2 id="activeAsset">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-warning summary-card">
<div class="card-body">
<h6>Repair</h6>
<h2 id="repairAsset">0</h2>
</div>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card bg-danger text-white summary-card">
<div class="card-body">
<h6>Expired Warranty</h6>
<h2 id="expiredAsset">0</h2>
</div>
</div>
</div>

</div>

<!-- ADD ASSET -->

<div class="card mb-4">

<div class="card-header">
<b>Add New Asset</b>
</div>

<div class="card-body">

<div class="row g-2">

<div class="col-md-2">
<input type="text" id="assetTag" class="form-control" placeholder="Asset Tag">
</div>

<div class="col-md-2">
<select id="category" class="form-select">
<option>Laptop</option>
<option>Desktop</option>
<option>Printer</option>
<option>Switch</option>
<option>Access Point</option>
<option>Server</option>
<option>POS</option>
<option>CCTV</option>
<option>TV</option>
</select>
</div>

<div class="col-md-2">
<input type="text" id="device" class="form-control" placeholder="Device">
</div>

<div class="col-md-2">
<input type="text" id="brand" class="form-control" placeholder="Brand">
</div>

<div class="col-md-2">
<input type="text" id="serial" class="form-control" placeholder="Serial Number">
</div>

<div class="col-md-2">
<input type="date" id="warranty" class="form-control">
</div>

</div>

<div class="row mt-2 g-2">

<div class="col-md-3">
<input type="text" id="user" class="form-control" placeholder="Assigned User">
</div>

<div class="col-md-3">
<input type="text" id="department" class="form-control" placeholder="Department">
</div>

<div class="col-md-3">
<input type="text" id="location" class="form-control" placeholder="Location">
</div>

<div class="col-md-2">
<select id="status" class="form-select">
<option>Active</option>
<option>Repair</option>
<option>Retired</option>
</select>
</div>

<div class="col-md-1">
<button class="btn btn-primary w-100" onclick="addAsset()">
Add
</button>
</div>

</div>

</div>

</div>

<!-- SEARCH -->

<div class="d-flex justify-content-between mb-3">

<input
type="text"
id="search"
class="form-control w-50"
placeholder="Search Asset..."
onkeyup="renderAssets()">

<button
class="btn btn-success"
onclick="exportCSV()">

<i class="bi bi-download"></i>
Export CSV

</button>

</div>

<!-- TABLE -->

<div class="card">

<div class="card-header">
<b>Asset Inventory</b>
</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-striped table-hover">

<thead class="table-dark">

<tr>
<th>Tag</th>
<th>Category</th>
<th>Device</th>
<th>Brand</th>
<th>Serial</th>
<th>User</th>
<th>Dept</th>
<th>Location</th>
<th>Status</th>
<th>Warranty</th>
<th>Action</th>
</tr>

</thead>

<tbody id="assetTable">
</tbody>

</table>

</div>

</div>

</div>

</div>

<!-- EDIT MODAL -->

<div class="modal fade" id="editModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Edit Asset</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>

<div class="modal-body">

<input type="hidden" id="editIndex">

<div class="mb-2">
<input type="text" id="editAssetTag" class="form-control">
</div>

<div class="mb-2">
<input type="text" id="editDevice" class="form-control">
</div>

<div class="mb-2">
<input type="text" id="editBrand" class="form-control">
</div>

<div class="mb-2">
<input type="text" id="editUser" class="form-control">
</div>

<div class="mb-2">
<input type="text" id="editDepartment" class="form-control">
</div>

<div class="mb-2">
<input type="text" id="editLocation" class="form-control">
</div>

<div class="mb-2">
<select id="editStatus" class="form-select">
<option>Active</option>
<option>Repair</option>
<option>Retired</option>
</select>
</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button
class="btn btn-primary"
onclick="saveEdit()">

Save Changes

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

let assets =
JSON.parse(localStorage.getItem("assets")) || [];

function saveAssets(){

localStorage.setItem(
"assets",
JSON.stringify(assets)
);

updateSummary();

}

function updateSummary(){

document.getElementById("totalAsset").innerHTML=
assets.length;

document.getElementById("activeAsset").innerHTML=
assets.filter(a=>a.status==="Active").length;

document.getElementById("repairAsset").innerHTML=
assets.filter(a=>a.status==="Repair").length;

let today = new Date();

document.getElementById("expiredAsset").innerHTML=
assets.filter(
a=>a.warranty &&
new Date(a.warranty) < today
).length;

}

function addAsset(){

if(assetTag.value===""){
alert("Asset Tag Required");
return;
}

assets.push({

assetTag:assetTag.value,
category:category.value,
device:device.value,
brand:brand.value,
serial:serial.value,
user:user.value,
department:department.value,
location:location.value,
status:status.value,
warranty:warranty.value

});

saveAssets();
renderAssets();

document.querySelectorAll("input").forEach(i=>{
if(i.type!=="hidden") i.value="";
});

}

function renderAssets(){

let keyword =
document.getElementById("search")
.value
.toLowerCase();

let table =
document.getElementById("assetTable");

table.innerHTML="";

assets.forEach((asset,index)=>{

if(JSON.stringify(asset)
.toLowerCase()
.includes(keyword)){

let color="success";

if(asset.status==="Repair")
color="warning";

if(asset.status==="Retired")
color="danger";

table.innerHTML+=`

<tr>

<td>${asset.assetTag}</td>
<td>${asset.category}</td>
<td>${asset.device}</td>
<td>${asset.brand}</td>
<td>${asset.serial}</td>
<td>${asset.user}</td>
<td>${asset.department}</td>
<td>${asset.location}</td>

<td>
<span class="badge bg-${color}">
${asset.status}
</span>
</td>

<td>${asset.warranty}</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="editAsset(${index})">

<i class="bi bi-pencil"></i>

</button>

<button
class="btn btn-danger btn-sm"
onclick="deleteAsset(${index})">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

`;

}

});

}

function editAsset(index){

let asset = assets[index];

editIndex.value=index;
editAssetTag.value=asset.assetTag;
editDevice.value=asset.device;
editBrand.value=asset.brand;
editUser.value=asset.user;
editDepartment.value=asset.department;
editLocation.value=asset.location;
editStatus.value=asset.status;

new bootstrap.Modal(
document.getElementById("editModal")
).show();

}

function saveEdit(){

let index =
document.getElementById("editIndex").value;

assets[index].assetTag =
editAssetTag.value;

assets[index].device =
editDevice.value;

assets[index].brand =
editBrand.value;

assets[index].user =
editUser.value;

assets[index].department =
editDepartment.value;

assets[index].location =
editLocation.value;

assets[index].status =
editStatus.value;

saveAssets();
renderAssets();

bootstrap.Modal
.getInstance(
document.getElementById("editModal")
).hide();

}

function deleteAsset(index){

if(confirm("Delete this asset?")){

assets.splice(index,1);

saveAssets();

renderAssets();

}

}

function exportCSV(){

let csv =
"Tag,Category,Device,Brand,Serial,User,Department,Location,Status,Warranty\n";

assets.forEach(a=>{

csv +=
`${a.assetTag},
${a.category},
${a.device},
${a.brand},
${a.serial},
${a.user},
${a.department},
${a.location},
${a.status},
${a.warranty}\n`;

});

let blob =
new Blob([csv],
{type:"text/csv"});

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"IT_Assets.csv";

link.click();

}

function toggleTheme(){
document.body.classList.toggle("dark-mode");
}

function logout(){

if(confirm("Logout?")){

sessionStorage.clear();

window.location.href="index.html";

}

}

saveAssets();
renderAssets();

</script>
<script src="js/network.js"></script>
</body>
</html>
