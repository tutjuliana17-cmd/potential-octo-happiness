<script>
if(sessionStorage.getItem("loggedIn") !== "true"){
    window.location.href="index.html";
}
</script>

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.navbar{
    box-shadow:0 1px 5px rgba(0,0,0,.1);
}

.summary-card{
    transition:.3s;
}

.summary-card:hover{
    transform:translateY(-5px);
}

</style>

<div class="container-fluid">

<span class="navbar-brand">
🏨 Hotel IT Asset Management
</span>

<div class="d-flex">

<a href="dashboard.html"
class="btn btn-light btn-sm me-2">

<i class="bi bi-house"></i>
Dashboard

</a>

<button
class="btn btn-danger btn-sm"
onclick="logout()">

<i class="bi bi-box-arrow-right"></i>
Logout

</button>

</div>

</div>

</nav>

<div class="container-fluid p-4">

<div class="row mb-4">

<div class="col-md-4">

<div class="card bg-primary text-white summary-card">
<div class="card-body">
<h6>Total Assets</h6>
<h2 id="totalAsset">0</h2>
</div>
</div>

</div>

<div class="col-md-4">

<div class="card bg-success text-white summary-card">
<div class="card-body">
<h6>Active</h6>
<h2 id="activeAsset">0</h2>
</div>
</div>

</div>

<div class="col-md-4">

<div class="card bg-warning summary-card">
<div class="card-body">
<h6>Repair</h6>
<h2 id="repairAsset">0</h2>
</div>
</div>

</div>

</div>

<div class="card mb-4">

<div class="card-header">

<b>Add New Asset</b>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-2">
<input
type="text"
id="assetTag"
class="form-control"
placeholder="Asset Tag">
</div>

<div class="col-md-2">
<input
type="text"
id="device"
class="form-control"
placeholder="Device">
</div>

<div class="col-md-2">
<input
type="text"
id="brand"
class="form-control"
placeholder="Brand">
</div>

<div class="col-md-2">
<input
type="text"
id="user"
class="form-control"
placeholder="Assigned User">
</div>

<div class="col-md-2">
<input
type="text"
id="department"
class="form-control"
placeholder="Department">
</div>

<div class="col-md-2">
<select
id="status"
class="form-select">

<option>Active</option>
<option>Repair</option>
<option>Retired</option>

</select>
</div>

</div>

<div class="row mt-3">

<div class="col-md-12">

<button
class="btn btn-primary"
onclick="addAsset()">

Add Asset

</button>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

<div class="row">

<div class="col-md-6">

<b>Asset Inventory</b>

</div>
