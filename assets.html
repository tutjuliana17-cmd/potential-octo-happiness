<script>

let assets =
JSON.parse(localStorage.getItem("assets")) || [

{
assetTag:"LT-001",
device:"Lenovo ThinkPad E14",
brand:"Lenovo",
user:"Juliana",
department:"IT",
status:"Active"
},

{
assetTag:"SW-001",
device:"Aruba 2930F",
brand:"Aruba",
user:"Server Room",
department:"IT",
status:"Active"
},

{
assetTag:"PRN-001",
device:"HP LaserJet",
brand:"HP",
user:"Front Office",
department:"FO",
status:"Repair"
}

];

function saveAssets(){

localStorage.setItem(
"assets",
JSON.stringify(assets)
);

updateSummary();

}

function updateSummary(){

document.getElementById("totalAsset").innerHTML =
assets.length;

document.getElementById("activeAsset").innerHTML =
assets.filter(a => a.status === "Active").length;

document.getElementById("repairAsset").innerHTML =
assets.filter(a => a.status === "Repair").length;

}

function addAsset(){

let assetTag =
document.getElementById("assetTag").value.trim();

let device =
document.getElementById("device").value.trim();

let brand =
document.getElementById("brand").value.trim();

let user =
document.getElementById("user").value.trim();

let department =
document.getElementById("department").value.trim();

let status =
document.getElementById("status").value;

if(assetTag === ""){

alert("Asset Tag wajib diisi");

return;

}

let duplicate =
assets.find(
a => a.assetTag === assetTag
);

if(duplicate){

alert("Asset Tag sudah ada");

return;

}

assets.push({

assetTag,
device,
brand,
user,
department,
status

});

saveAssets();

renderAssets();

clearForm();

}

function clearForm(){

document.getElementById("assetTag").value="";
document.getElementById("device").value="";
document.getElementById("brand").value="";
document.getElementById("user").value="";
document.getElementById("department").value="";

}

function renderAssets(){

let keyword =
document.getElementById("search")
? document.getElementById("search")
.value
.toLowerCase()
: "";

let table =
document.getElementById("assetTable");

table.innerHTML = "";

assets.forEach((asset,index)=>{

if(

asset.assetTag.toLowerCase().includes(keyword)
||
asset.device.toLowerCase().includes(keyword)
||
asset.brand.toLowerCase().includes(keyword)
||
asset.user.toLowerCase().includes(keyword)
||
asset.department.toLowerCase().includes(keyword)

){

let color="secondary";

if(asset.status==="Active")
color="success";

if(asset.status==="Repair")
color="warning";

if(asset.status==="Retired")
color="danger";

table.innerHTML += `

<tr>

<td>${asset.assetTag}</td>

<td>${asset.device}</td>

<td>${asset.brand}</td>

<td>${asset.user}</td>

<td>${asset.department}</td>

<td>
<span class="badge bg-${color}">
${asset.status}
</span>
</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="editAsset(${index})">

<i class="bi bi-pencil"></i>

</button>

<button
class="btn btn-danger btn-sm"
onclick="deleteAsset(${index})">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

`;

}

});

}

function deleteAsset(index){

if(confirm(
"Delete Asset " +
assets[index].assetTag +
" ?"
))
{

assets.splice(index,1);

saveAssets();

renderAssets();

}

}

function editAsset(index){

let asset =
assets[index];

document.getElementById("editIndex").value =
index;

document.getElementById("editAssetTag").value =
asset.assetTag;

document.getElementById("editDevice").value =
asset.device;

document.getElementById("editBrand").value =
asset.brand;

document.getElementById("editUser").value =
asset.user;

document.getElementById("editDepartment").value =
asset.department;

document.getElementById("editStatus").value =
asset.status;

let modal =
new bootstrap.Modal(
document.getElementById("editModal")
);

modal.show();

}

function saveEdit(){

let index =
document.getElementById("editIndex").value;

assets[index] = {

assetTag:
document.getElementById("editAssetTag").value,

device:
document.getElementById("editDevice").value,

brand:
document.getElementById("editBrand").value,

user:
document.getElementById("editUser").value,

department:
document.getElementById("editDepartment").value,

status:
document.getElementById("editStatus").value

};

saveAssets();

renderAssets();

bootstrap.Modal
.getInstance(
document.getElementById("editModal")
)
.hide();

}

function exportAssets(){

let csv =
"Asset Tag,Device,Brand,User,Department,Status\n";

assets.forEach(asset=>{

csv +=

asset.assetTag + "," +
asset.device + "," +
asset.brand + "," +
asset.user + "," +
asset.department + "," +
asset.status +

"\n";

});

let blob =
new Blob(
[csv],
{
type:"text/csv"
}
);

let link =
document.createElement("a");

link.href =
window.URL.createObjectURL(blob);

link.download =
"IT_Assets.csv";

link.click();

}

function logout(){

if(confirm(
"Are you sure want to logout?"
))
{

sessionStorage.clear();

window.location.replace(
"index.html"
);

}

}

window.history.pushState(
null,
null,
window.location.href
);

window.onpopstate = function(){

window.history.go(1);

};

saveAssets();

renderAssets();

</script>
